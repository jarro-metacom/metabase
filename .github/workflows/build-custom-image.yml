name: Build Custom Image

# v64 line. Pushes ONLY the versioned tag — never :latest — so production hosts
# (which run :latest) are not affected until a deliberate cutover/retag.
on:
  push:
    branches:
      - feature/column-picker-search-v64
  workflow_dispatch:

env:
  UPSTREAM_VERSION: v0.64.8.4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set version
        id: version
        run: echo "value=${UPSTREAM_VERSION}-custom" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/jarro-metacom/metabase:${{ steps.version.outputs.value }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
